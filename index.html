<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susan Pro — Simulasi Harga Packaging</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#FAF8F4;color:#2C1A0E;min-height:100vh;font-size:15px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding:0 0 3rem}
.hdr{background:#fff;border-bottom:1px solid #E8E2D9;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-box{width:32px;height:32px;background:#C9A84C;border-radius:6px;display:flex;align-items:center;justify-content:center}
.hdr-box svg{width:18px;height:18px;fill:#fff}
.hdr-name{font-size:16px;font-weight:600;color:#2C1A0E;letter-spacing:-.3px}
.hdr-tag{font-size:11px;color:#9A7B1A;background:#FDF3D7;padding:3px 9px;border-radius:20px;font-weight:500}
.prog{display:flex;align-items:flex-start;padding:1.25rem 1.5rem 0;gap:0}
.ps{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;position:relative}
.ps:not(:last-child)::after{content:'';position:absolute;top:14px;left:calc(50% + 14px);right:calc(-50% + 14px);height:1px;background:#E8E2D9}
.pd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;transition:all .2s;z-index:1}
.pd.done{background:#9A7B1A;color:#fff}
.pd.active{background:#fff;border:2.5px solid #C9A84C;color:#9A7B1A}
.pd.todo{background:#F0EBE3;color:#B8A898;border:1px solid #E0D8CD}
.pl{font-size:10px;color:#B8A898;text-align:center;max-width:52px}
.pl.active{color:#9A7B1A;font-weight:500}
.card{background:#fff;border:1px solid #E8E2D9;border-radius:14px;margin:1rem 1.5rem 0;overflow:hidden}
.card-body{padding:1.25rem 1.5rem}
.step-title{font-size:17px;font-weight:600;margin-bottom:3px}
.step-sub{font-size:13px;color:#7A6658;margin-bottom:1.1rem}
.df{margin-bottom:1rem}
.df:last-child{margin-bottom:0}
.df label{font-size:11px;font-weight:600;color:#7A6658;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.df input[type=text],.df input[type=number]{width:100%;padding:10px 12px;border:1.5px solid #E8E2D9;border-radius:9px;font-size:14px;background:#fff;color:#2C1A0E;outline:none;transition:border-color .15s;font-family:inherit}
.df input:focus{border-color:#C9A84C;box-shadow:0 0 0 3px #C9A84C14}
.df textarea{width:100%;padding:10px 12px;border:1.5px solid #E8E2D9;border-radius:9px;font-size:13px;background:#fff;color:#2C1A0E;outline:none;transition:border-color .15s;font-family:inherit;resize:vertical;min-height:110px;line-height:1.6}
.df textarea:focus{border-color:#C9A84C;box-shadow:0 0 0 3px #C9A84C14}
.df textarea::placeholder{color:#C4B8AC}
.df input::placeholder{color:#C4B8AC}
/* Drop zone */
.dz{border:2px dashed #DDD5C8;border-radius:11px;padding:1.2rem;text-align:center;cursor:pointer;transition:all .2s;background:#FAFAF8;position:relative}
.dz:hover,.dz.over{border-color:#C9A84C;background:#FEFBF3}
.dz-icon{font-size:26px;margin-bottom:6px;display:block}
.dz-text{font-size:13px;color:#7A6658;margin-bottom:3px}
.dz-text u{color:#9A7B1A;cursor:pointer}
.dz-types{font-size:11px;color:#B8A898;display:block}
.dz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #E8E2D9;border-radius:20px;padding:5px 10px 5px 8px;font-size:12px;color:#2C1A0E;max-width:200px}
.chip-icon{font-size:14px;flex-shrink:0}
.chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip-x{width:16px;height:16px;border-radius:50%;background:#F0EBE3;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#7A6658;flex-shrink:0;padding:0}
.chip-x:hover{background:#E8D8A8;color:#5A3A00}
.img-preview{width:40px;height:40px;border-radius:5px;object-fit:cover;border:1px solid #E8E2D9;flex-shrink:0}
/* Box types */
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{padding:1rem;border:1.5px solid #E8E2D9;border-radius:10px;cursor:pointer;transition:all .15s;background:#fff}
.tc:hover{border-color:#C9A84C;background:#FEFBF3}
.tc.sel{border-color:#C9A84C;background:#FEFBF3;box-shadow:0 0 0 3px #C9A84C18}
.tc-icon{font-size:24px;margin-bottom:7px;display:block}
.tc h3{font-size:13px;font-weight:600;margin-bottom:2px;color:#2C1A0E}
.tc p{font-size:11px;color:#7A6658}
/* Dimensions */
.dr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:.9rem}
.box-preview{background:#FEFBF3;border:1px solid #E8E2D9;border-radius:10px;padding:.75rem;margin-top:.5rem}
.box-note{font-size:11px;color:#B8A898;text-align:center;margin-top:4px}
/* Materials */
.ms{margin-bottom:1rem}
.ms h4{font-size:11px;font-weight:600;color:#9A7B1A;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid #F0EBE3}
.mg{display:flex;flex-direction:column;gap:5px}
.mo{padding:9px 12px;border:1.5px solid #E8E2D9;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .15s;background:#fff}
.mo:hover{border-color:#C9A84C;background:#FEFBF3}
.mo.sel{border-color:#C9A84C;background:#FEFBF3;box-shadow:0 0 0 3px #C9A84C12}
.mo-name{font-size:13px;font-weight:500;color:#2C1A0E}
.mo-cat{font-size:11px;color:#7A6658;margin-top:1px}
.mo-right{text-align:right;flex-shrink:0;margin-left:10px}
.mo-price{font-size:12px;font-weight:600;color:#9A7B1A}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;margin-top:2px}
.badge-p{background:#FDF3D7;color:#9A7B1A}
.badge-s{background:#E8F5EE;color:#2E7D6E}
.badge-e{background:#F3F1EE;color:#7A6658}
/* Accessories */
.ai{border:1.5px solid #E8E2D9;border-radius:10px;overflow:hidden;margin-bottom:8px;background:#fff}
.at{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer}
.at:hover{background:#FEFBF3}
.at h4{font-size:13px;font-weight:500;margin-bottom:2px}
.at p{font-size:11px;color:#7A6658}
.tog{width:40px;height:22px;border-radius:11px;background:#E8E2D9;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.tog.on{background:#C9A84C}
.tog::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on::after{transform:translateX(18px)}
.as{padding:12px 14px;border-top:1px solid #F0EBE3;background:#FEFBF3}
.as-note{font-size:11px;color:#B8A898;margin-top:4px}
/* Quantity */
.qty-num{font-size:52px;font-weight:700;color:#9A7B1A;text-align:center;line-height:1;margin:1rem 0 2px}
.qty-lbl{font-size:12px;color:#7A6658;text-align:center;margin-bottom:1rem}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:#E8E2D9;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#C9A84C;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tier-ticks{display:flex;justify-content:space-between;font-size:10px;color:#B8A898;margin-top:4px;padding:0 1px}
.tp{border:1px solid #E8E2D9;border-radius:10px;overflow:hidden;margin-top:1rem}
.tr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #F0EBE3;font-size:13px;background:#fff}
.tr:last-child{border-bottom:none}
.tr.at-tier{background:#FEFBF3;border-left:3px solid #C9A84C}
.tr.at-tier .t-price{font-weight:600;color:#9A7B1A}
.t-lbl{color:#7A6658}
.tr.at-tier .t-lbl{color:#9A7B1A;font-weight:500}
/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem}
.btn-gold{background:#C9A84C;color:#3D2314;border:none;padding:11px 24px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
.btn-gold:hover{opacity:.9}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:#fff;border:1.5px solid #E8E2D9;padding:10px 20px;border-radius:9px;font-size:14px;cursor:pointer;color:#2C1A0E;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn-ghost:hover{border-color:#C9A84C;color:#9A7B1A}
/* Result */
.result-wrap{padding:0 1.5rem}
.r-back{display:flex;align-items:center;gap:8px;padding:1rem 0 .75rem;font-size:12px;color:#7A6658}
.r-back button{background:none;border:1.5px solid #E8E2D9;padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;color:#7A6658;display:flex;align-items:center;gap:5px}
.r-back button:hover{border-color:#C9A84C;color:#9A7B1A}
.hero{background:#FEF9EF;border:1.5px solid #E8D89A;border-radius:14px;padding:1.5rem;text-align:center;margin-bottom:1rem}
.hero-lbl{font-size:11px;color:#9A7B1A;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.hero-price{font-size:44px;font-weight:700;color:#2C1A0E;line-height:1;margin-bottom:4px}
.hero-price span{font-size:20px;font-weight:400;color:#7A6658}
.hero-total{font-size:14px;color:#7A6658;margin-bottom:8px}
.hero-hpp{font-size:11px;color:#B8A898;padding-top:8px;border-top:1px solid #E8D89A}
.tier-table{border:1px solid #E8E2D9;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.tier-row{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid #F0EBE3;background:#fff;font-size:13px}
.tier-row:last-child{border-bottom:none}
.tier-row.active{background:#FEFBF3;border-left:3px solid #C9A84C}
.tier-row.active .t-p{color:#9A7B1A;font-weight:600}
.t-p{font-weight:500}
.t-badge{font-size:10px;background:#C9A84C22;color:#9A7B1A;padding:2px 8px;border-radius:10px;font-weight:500}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.metric{background:#fff;border:1px solid #E8E2D9;border-radius:10px;padding:10px 12px;text-align:center}
.m-lbl{font-size:10px;color:#B8A898;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.m-val{font-size:14px;font-weight:600;color:#2C1A0E}
.section-lbl{font-size:13px;font-weight:600;color:#7A6658;margin:.9rem 0 6px}
.breakdown{border:1px solid #E8E2D9;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.bd-header{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;cursor:pointer;background:#fff;font-size:13px;font-weight:500;user-select:none}
.bd-header:hover{background:#FAFAF8}
.bd-header svg{transition:transform .2s;flex-shrink:0}
.bd-header.open svg{transform:rotate(180deg)}
.bd-body{border-top:1px solid #F0EBE3}
.bd-row{display:flex;justify-content:space-between;padding:8px 15px;border-bottom:1px solid #F5F2EE;font-size:12px;background:#fff}
.bd-row:last-child{border-bottom:none}
.bd-row.tot{font-weight:600;background:#FAFAF8}
.bd-row .lbl{color:#7A6658}
.alt-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:1.5rem}
.alt-card{background:#fff;border:1.5px solid #E8E2D9;border-radius:11px;padding:12px 14px;transition:all .15s}
.alt-card:hover{border-color:#C9A84C;box-shadow:0 2px 8px #C9A84C18}
.alt-title{font-size:12px;font-weight:600;color:#2C1A0E;margin-bottom:3px}
.alt-desc{font-size:11px;color:#7A6658;margin-bottom:8px;line-height:1.4}
.alt-price{font-size:15px;font-weight:700;color:#9A7B1A}
.alt-diff{font-size:11px;margin-top:2px}
.alt-cheaper{color:#2E7D6E}
.alt-pricier{color:#9A7B1A}
.brief-summary{background:#F5F0E8;border-radius:10px;padding:.8rem 1rem;margin-bottom:.9rem;font-size:12px;color:#5A3E2B;line-height:1.5;border:1px solid #E8D8B8}
.brief-summary strong{display:block;font-size:11px;font-weight:600;color:#9A7B1A;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.disclaimer{background:#F3F1EE;border-radius:10px;padding:.9rem 1rem;margin-top:1rem;font-size:11px;color:#7A6658;line-height:1.5;border:1px solid #E8E2D9}
.disclaimer strong{color:#2C1A0E}
/* AI styles */
.ai-btn{width:100%;background:#2C1A0E;color:#C9A84C;border:none;padding:12px 20px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:1rem;transition:opacity .15s}
.ai-btn:hover{opacity:.88}
.ai-btn:disabled{opacity:.32;cursor:not-allowed}
.ai-spin{width:16px;height:16px;border:2px solid #C9A84C44;border-top:2px solid #C9A84C;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result{background:#FEF9EF;border:1.5px solid #E8D89A;border-radius:12px;padding:1rem 1.1rem;margin-top:1rem}
.ai-result-title{font-size:11px;font-weight:600;color:#9A7B1A;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.7rem;display:flex;align-items:center;gap:6px}
.ai-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #F0EAD8;font-size:12px}
.ai-row:last-child{border-bottom:none}
.ai-row-lbl{color:#7A6658}
.ai-row-val{font-weight:500;color:#2C1A0E;text-align:right}
.ai-blank{color:#C4B8AC;font-style:italic}
.ai-hint{display:inline-block;font-size:10px;background:#2C1A0E;color:#C9A84C;padding:1px 6px;border-radius:6px;margin-left:5px;font-weight:500;vertical-align:middle}
.ai-err{background:#FEF0EE;border:1px solid #F5C1B3;border-radius:10px;padding:.9rem 1rem;margin-top:1rem;font-size:12px;color:#7A2010}
.mo.ai-pre{border-color:#C9A84C66;background:#FEFBF3}
.tc.ai-pre{border-color:#C9A84C66;background:#FEFBF3}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-logo">
      <div class="hdr-box">
        <svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="9" y1="9" x2="15" y2="9" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><line x1="9" y1="12" x2="15" y2="12" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><line x1="9" y1="15" x2="12" y2="15" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>
      <span class="hdr-name">Susan Pro</span>
    </div>
    <span class="hdr-tag">Simulasi Harga Packaging</span>
  </div>
  <div id="root"></div>
</div>

<script>
const STEPS=['Brief','Tipe Box','Dimensi','Material','Aksesoris','Kuantitas']

// Panel allowances berdasarkan data mentah Excel (diverifikasi 30 Mei 2026):
// RANGKA    : 0 allowance — board dipotong persis ukuran box
// KRAFT     : 0 allowance — kraft dipotong persis ukuran muka box
// PEL LUAR  : pw = p+t+10.5, lw = l+t*2+34  (Slip In, tervalidasi)
//             pw = p*2+t*2+7, lw = l+6       (Flap wrap-around, tervalidasi)
// PEL DALAM : pw = p+t+8.5,  lw = l+t*2+32  (Slip In, tervalidasi)
// Slorok & Hampers: rangka+kraft dikoreksi, pelapis masih estimasi

const BT=[
  {id:'flap',icon:'📦',name:'Box Flap',desc:'Tutup depan, paling umum',
   panels:(p,l,t)=>[
    // Rangka: +1cm saja (toleransi potong) — verified dari data
    {n:'Rangka Tutup',m:'rk',pw:p+1,lw:l+1,q:1,g:0},
    {n:'Rangka Alas',m:'rk',pw:p,lw:l,q:1,g:0},
    {n:'Rangka Samping',m:'rk',pw:t,lw:l,q:4,g:0},
    // Kraft: 0 allowance — verified (bukan +6cm)
    {n:'Kraft Embos',m:'kr',pw:p,lw:l,q:2,g:1.33},
    // Pel Luar: wrap keliling semua sisi tutup — verified dari BOX 1an
    // pw = p*2 + t*2 + 7 (wrap full), lw = l + 6 (fold 3cm tiap sisi)
    {n:'Pelapis Luar',m:'ou',pw:p*2+t*2+7,lw:l+6,q:1,g:1.11},
    // Pel strip dinding dalam
    {n:'Pel Strip',m:'ou',pw:t+l+6,lw:l+3,q:1,g:1.11},
    // Dalam: formula sama dengan Slip In
    {n:'Pelapis Dalam',m:'in',pw:p+t+8.5,lw:l+t*2+32,q:1,g:1.11}
   ],lab:()=>44000},  // verified dari file: rakit 8rb+pel 35rb+pbb 1rb=44rb (tanpa magnet)
  {id:'slip_in',icon:'🗂',name:'Box Slip In',desc:'Sliding masuk, elegan',
   panels:(p,l,t)=>[
    // Semua formula tervalidasi dari file Box Slip In 30×30×5
    {n:'Rangka Atas/Bawah',m:'rk',pw:p,lw:l,q:2,g:0},       // 0 allowance
    {n:'Rangka Samping',m:'rk',pw:t,lw:l,q:4,g:0},           // 0 allowance
    {n:'Kraft Embos',m:'kr',pw:p,lw:l,q:2,g:1.33},           // 0 allowance — verified
    {n:'Pel Luar Bawah',m:'ou',pw:p+t+10.5,lw:l+t*2+34,q:1,g:1.11},  // verified ✓
    {n:'Pel Luar Atas',m:'ou',pw:p+t+10.5,lw:l+t*2+34,q:1,g:1.11},   // verified ✓
    {n:'Pelapis Dalam',m:'in',pw:p+t+8.5,lw:l+t*2+32,q:1,g:1.11}     // verified ✓
   ],lab:()=>35000},  // verified dari file: flat Rp 35.000 untuk ~30×30×5
  {id:'slorok',icon:'🪣',name:'Box Slorok',desc:'Laci/drawer, statement',
   panels:(p,l,t)=>[
    // Rangka: +0-1cm (dikoreksi dari +4-6cm)
    {n:'Rangka Selongsong',m:'rk',pw:p+1,lw:l+1,q:2,g:0},
    {n:'Rangka Laci',m:'rk',pw:p,lw:t,q:2,g:0},
    {n:'Skat Dalam',m:'rk',pw:p,lw:l,q:1,g:0},
    // Kraft: 0 allowance (dikoreksi dari +6cm)
    {n:'Kraft Embos',m:'kr',pw:p,lw:l,q:2,g:1.33},
    // Pelapis: estimasi (belum tervalidasi dari file — perlu konfirmasi Susan Pro)
    {n:'Pel Selongsong',m:'ou',pw:p+t*2+16,lw:l+t*2+34,q:1,g:1.11},
    {n:'Pel Laci Luar',m:'ou',pw:p+t+10.5,lw:l+t*2+34,q:1,g:1.11},
    {n:'Pelapis Dalam',m:'in',pw:p+t+8.5,lw:l+t*2+32,q:2,g:1.11}
   ],lab:(p,l,t)=>50000+p*l*t*0.06},
  {id:'hampers',icon:'🎁',name:'Box Hampers',desc:'Box besar gift set',
   panels:(p,l,t)=>[
    // Rangka: 0 allowance (dikoreksi)
    {n:'Rangka Utama',m:'rk',pw:p,lw:l,q:2,g:0},
    {n:'Rangka Samping',m:'rk',pw:t,lw:l,q:4,g:0},
    // Kraft: 0 allowance (dikoreksi dari +8cm)
    {n:'Kraft Embos',m:'kr',pw:p,lw:l,q:2,g:1.33},
    // Pelapis: estimasi mengacu formula Flap

// Load PDF.js dari cdnjs (lazy — hanya saat ada PDF)
let _pdfjsReady = null
function loadPdfJs(){
  if(_pdfjsReady) return _pdfjsReady
  _pdfjsReady = new Promise((res, rej)=>{
    if(window.pdfjsLib){ res(window.pdfjsLib); return }
    const VER = '3.11.174'
    const BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${VER}`
    const s = document.createElement('script')
    s.src = `${BASE}/pdf.min.js`
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${BASE}/pdf.worker.min.js`
      res(window.pdfjsLib)
    }
    s.onerror = ()=>{ _pdfjsReady=null; rej(new Error('PDF.js gagal dimuat')) }
    document.head.appendChild(s)
  })
  return _pdfjsReady
}

// Render setiap halaman PDF menjadi base64 JPEG
async function extractPdfPages(file){
  const lib = await loadPdfJs()
  const buf = await readFileAs(file,'arraybuffer')
  const pdf = await lib.getDocument({data: buf}).promise
  const pages = []
  const total = Math.min(pdf.numPages, 10)  // max 10 halaman
  for(let i=1; i<=total; i++){
    const page = await pdf.getPage(i)
    // Render di skala 0.8 agar tidak terlalu besar
    const vp = page.getViewport({scale:0.8})
    const canvas = document.createElement('canvas')
    canvas.width = vp.width; canvas.height = vp.height
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise
    pages.push({page:i, data: canvas.toDataURL('image/jpeg', 0.75)})
  }
  return pages
}

// Helper: baca file sebagai teks atau dataURL
function readFileAs(file, mode){
  return new Promise((res,rej)=>{
    const r=new FileReader()
    r.onload=e=>res(e.target.result)
    r.onerror=rej
    if(mode==='text') r.readAsText(file)
    else if(mode==='dataurl') r.readAsDataURL(file)
    else r.readAsArrayBuffer(file)
  })
}

// Ekstrak teks kasar dari DOCX (ZIP+XML) tanpa library
async function extractDocxText(file){
  try{
    const text=await readFileAs(file,'text')
    // Hapus XML tags, ambil teks yang tersisa
    return text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().substring(0,3000)
  }catch(e){ return '' }
}

// Panggil Anthropic API langsung (fallback saat tidak ada window.cowork)
async function callAnthropicDirect(prompt, imgDataUrls=[]){
  if(!API_KEY) throw new Error('API key belum diisi. Masukkan Anthropic API key di pengaturan.')
  const content = []
  // Lampirkan gambar (vision)
  for(const dataUrl of imgDataUrls){
    const [hdr, b64] = dataUrl.split(',')
    const mt = hdr.match(/:(.*?);/)?.[1] || 'image/jpeg'
    // Hanya kirim gambar yang tidak terlalu besar (max ~1MB base64)
    if(b64 && b64.length < 1400000){
      content.push({type:'image', source:{type:'base64', media_type:mt, data:b64}})
    }
  }
  content.push({type:'text', text:prompt})
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': API_KEY,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-haiku-4-5-20251001',
      max_tokens:1024,
      messages:[{role:'user', content}]
    })
  })
  if(!res.ok){
    const err = await res.json().catch(()=>({}))
    throw new Error(err.error?.message || `API error ${res.status}`)
  }
  const data = await res.json()
  return data.content?.[0]?.text || ''
}

function calc(s,skip=false){
  const b=BT.find(x=>x.id===s.bt)
  const panels=b.panels(s.p,s.l,s.t)
  const bkd=[];let mT=0,gT=0
  for(const pn of panels){
    const a=pn.pw*pn.lw*pn.q
    let mc=0
    if(pn.m==='rk')mc=a*s.rk.p
    else if(pn.m==='ou')mc=a*s.ou.p
    else if(pn.m==='in')mc=a*s.in.p
    else if(pn.m==='kr')mc=a*0.21
    const gc=a*pn.g
    bkd.push({n:pn.n,mc,gc,tot:mc+gc})
    mT+=mc;gT+=gc
  }
  let aT=0
  if(s.logo){const la=s.lp*s.ll;const lc=la*550+la*1.11*2;aT+=lc;bkd.push({n:'Logo Foil Emas',mc:la*550,gc:la*1.11*2,tot:lc})}
  if(s.mag){aT+=2500;bkd.push({n:'Magnet Closure',mc:2500,gc:0,tot:2500})}
  if(s.rib){aT+=1500;bkd.push({n:'Pita Ribbon',mc:1500,gc:0,tot:1500})}
  const lab=Math.round(b.lab(s.p,s.l,s.t))
  const sub=mT+gT+aT+lab,risk=sub*0.02,hpp=sub+risk+9500,base=hpp/0.60
  const tiers=[
    {lbl:'1 pcs',mn:1,mx:1,pr:r5(base)},
    {lbl:'2 – 25 pcs',mn:2,mx:25,pr:r5(base*.90)},
    {lbl:'26 – 50 pcs',mn:26,mx:50,pr:r5(base*.85)},
    {lbl:'51 – 75 pcs',mn:51,mx:75,pr:r5(base*.80)},
    {lbl:'76 – 100 pcs',mn:76,mx:100,pr:r5(base*.75)},
  ]
  const at=tiers.find(x=>s.qty>=x.mn&&s.qty<=x.mx)||tiers[4]
  let alts=[]
  if(!skip){
    if(s.ou.p>3){const c=OM.find(m=>m.p<s.ou.p&&m.p>=0.7);if(c){const r=calc({...s,ou:c},true);const p=r.tiers.find(x=>s.qty>=x.mn&&s.qty<=x.mx)?.pr||r.tiers[4].pr;alts.push({lbl:'Versi Budget',desc:`${s.ou.n} → ${c.n}`,pr:p,diff:at.pr})}}
    if(s.ou.p<15){const c=OM.find(m=>m.p>s.ou.p&&m.p>=15);if(c){const r=calc({...s,ou:c},true);const p=r.tiers.find(x=>s.qty>=x.mn&&s.qty<=x.mx)?.pr||r.tiers[4].pr;alts.push({lbl:'Upgrade Premium',desc:`${s.ou.n} → ${c.n}`,pr:p,diff:at.pr})}}
    if(s.rk.p>1){const c=RM.find(m=>m.p<s.rk.p);if(c){const r=calc({...s,rk:c},true);const p=r.tiers.find(x=>s.qty>=x.mn&&s.qty<=x.mx)?.pr||r.tiers[4].pr;alts.push({lbl:'Rangka Lebih Ringan',desc:`${s.rk.n} → ${c.n}`,pr:p,diff:at.pr})}}
  }
  return{bkd,mT,gT,aT,lab,sub,risk,hpp,base,tiers,at,alts}
}

  <div class="disclaimer">
    <strong>Catatan:</strong> Hasil ini adalah <strong>estimasi</strong> berbasis kalkulasi internal Susan Pro 2026.
    Harga final dapat berbeda setelah validasi spesifikasi oleh tim produksi.
  </div>
</div>`
}

function rnav(){
  const ok=S.clientName.trim().length>0
  const c=[ok,!!S.bt,S.p>0&&S.l>0&&S.t>0,!!(S.ou&&S.in&&S.rk),true,!!(S.ou&&S.in&&S.rk&&S.bt)][S.step-1]
  return`<div class="nav">
    ${S.step>1?`<button class="btn-ghost" id="bback">← Kembali</button>`:'<span></span>'}
    <button class="btn-gold" id="bnext" ${!c?'disabled':''}>
      ${S.step===6?'Hitung Harga 🧮':'Lanjut →'}
    </button>
  </div>`
}

function rapp(){
  const root=document.getElementById('root')
  if(S.step>6){
    root.innerHTML=rresult()
  } else {
    const fns=[rs1,rs2,rs3,rs4,rs5,rs6]
    root.innerHTML=rprog()+fns[S.step-1]()+rnav()
  }
  bind()
}

function addFiles(newFiles){
  for(const file of Array.from(newFiles)){
    if(S.files.find(f=>f.name===file.name&&f.size===file.size)) continue
    if(['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){
      const reader=new FileReader()
      reader.onload=e=>{file._preview=e.target.result;rapp();updateAiBtn()}
      reader.readAsDataURL(file)
    }
    S.files.push(file)
  }
  rapp()
  updateAiBtn()
}

function bind(){
  // Brief step
  const cn=document.getElementById('cn'),bt=document.getElementById('bt')
  const fi=document.getElementById('fi'),dz=document.getElementById('dz')
  if(cn){
    cn.addEventListener('input',e=>{S.clientName=e.target.value;
      document.getElementById('bnext')&&(document.getElementById('bnext').disabled=!S.clientName.trim())})
  }
  if(bt) bt.addEventListener('input',e=>{
    S.briefText=e.target.value
    updateAiBtn()
  })
  if(fi) fi.addEventListener('change',e=>{addFiles(e.target.files);fi.value=''})
  if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')})
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'))
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');addFiles(e.dataTransfer.files)})
  }
  document.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();S.files.splice(parseInt(el.dataset.rm),1);rapp()
  }))

  // Box types
  document.querySelectorAll('[data-bt]').forEach(el=>el.addEventListener('click',()=>{S.bt=el.dataset.bt;rapp()}))

  // Materials
  document.querySelectorAll('[data-gp]').forEach(el=>el.addEventListener('click',()=>{
    const g=el.dataset.gp,id=el.dataset.mid
    if(g==='ou')S.ou=OM.find(m=>m.id===id)
    else if(g==='in')S.in=IM.find(m=>m.id===id)
    else S.rk=RM.find(m=>m.id===id)
    rapp()
  }))

  // Dimensions
  const g=(id,cb)=>{const el=document.getElementById(id);if(el)el.addEventListener('input',cb)}
  g('ip',e=>{S.p=parseFloat(e.target.value)||30;rapp()})
  g('il',e=>{S.l=parseFloat(e.target.value)||30;rapp()})
  g('it',e=>{S.t=parseFloat(e.target.value)||5;rapp()})

  // Accessories
  document.querySelectorAll('[data-tg]').forEach(el=>el.addEventListener('click',()=>{S[el.dataset.tg]=!S[el.dataset.tg];rapp()}))
  g('lp',e=>{S.lp=parseFloat(e.target.value)||8;rapp()})
  g('ll',e=>{S.ll=parseFloat(e.target.value)||8;rapp()})

  // Qty
  g('qr',e=>{S.qty=parseInt(e.target.value);rapp()})
  g('qn',e=>{S.qty=parseInt(e.target.value)||1;rapp()})

  // API key save (hanya di browser mode)
  const saveKey=document.getElementById('save-key')
  if(saveKey) saveKey.addEventListener('click',()=>{
    const val=document.getElementById('api-key-input')?.value?.trim()||''
    API_KEY=val
    localStorage.setItem('sp_api_key', val)
    rapp()
  })

  // AI
  const aiBtn=document.getElementById('ai-btn')
  const aiApply=document.getElementById('ai-apply')
  const aiClear=document.getElementById('ai-clear')
  if(aiBtn) aiBtn.addEventListener('click',()=>analyzeWithAI())
  if(aiApply) aiApply.addEventListener('click',()=>applyAIResult())
  if(aiClear) aiClear.addEventListener('click',()=>{S.aiState=null;S.aiResult=null;S.aiApplied=false;rapp();updateAiBtn()})

  // Nav
  const bnext=document.getElementById('bnext'),bback=document.getElementById('bback')
  const bback2=document.getElementById('bback2'),bdh=document.getElementById('bdh')
  if(bnext)bnext.addEventListener('click',()=>{S.step===6?(S.result=calc(S),S.step=7):S.step++;rapp()})
  if(bback)bback.addEventListener('click',()=>{S.step--;rapp()})
  if(bback2)bback2.addEventListener('click',()=>{S.step=1;S.result=null;S.bdOpen=false;rapp()})
  if(bdh)bdh.addEventListener('click',()=>{S.bdOpen=!S.bdOpen;rapp()})
}

rapp()
</script>
</body>
</html>
